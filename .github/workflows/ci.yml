name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Install crawler-service dependencies
      run: npm install --prefix mini-services/crawler-service

    - name: Build crawler-service
      run: npm run build --prefix mini-services/crawler-service

    - name: Lint
      run: npm run lint

    - name: Build Next.js app
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
